<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>מעצב הסלון – על התמונות שלך</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Arial;background:#0B1016;color:#eee}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#191c24;position:sticky;top:0;z-index:9;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1;white-space:nowrap}button,select{background:#2a2f3c;color:#eee;border:0;border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer}
button.on{background:#e0a84f;color:#111}main{display:flex;flex-wrap:wrap}
#left{flex:2 1 560px;padding:8px;min-width:0}#view{position:relative;overflow:hidden;background:repeating-conic-gradient(#1a1d24 0 25%,#14161b 0 50%) 0 0/24px 24px;border-radius:14px;background:#000;touch-action:none;aspect-ratio:4/3}
#inner{position:absolute;inset:0;transform-origin:0 0}#gl,#ov{position:absolute;inset:0;width:100%;height:100%}
#thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}#thumbs img{height:64px;border-radius:8px;border:3px solid transparent;cursor:pointer}#thumbs img.on{border-color:#e0a84f}
#thumbs label{display:flex;align-items:center;justify-content:center;min-width:86px;height:64px;border:2px dashed #555;border-radius:8px;cursor:pointer;font-size:13px;text-align:center}
#panel{flex:1 1 320px;padding:8px 10px;max-height:calc(100vh - 54px);overflow:auto}
.sec{background:#191c24;border-radius:14px;padding:10px;margin-bottom:9px}.sec h3{margin:0 0 7px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sw span{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px #0008;background-size:cover}
.sw span.on{border-color:#e0a84f}.sw span.tx{border-radius:8px;width:44px;height:44px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}input[type=range]{flex:1}
#hint{font-size:12.5px;color:#9aa;margin-top:6px;min-height:18px}#ba{width:100%}
.lbl{position:absolute;top:8px;padding:3px 8px;border-radius:8px;background:#0009;font-size:12px;pointer-events:none}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-size:18px}
input[type=color]{width:34px;height:32px;border:0;background:none;padding:0}
</style></head><body>
<header><h1>🛋️ מעצב הסלון</h1>
<button id="surprise">🎲 הפתע אותי</button><button id="reset">↺ מקורי</button><button id="share">🔗 שתף</button><button id="dl">⬇️ הורד HD</button></header>
<main><div id="left">
<div id="view"><div id="inner"><canvas id="gl"></canvas><canvas id="ov"></canvas></div><canvas id="hv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none"></canvas><span class="lbl" style="left:8px">אחרי</span><span class="lbl" style="right:8px">לפני</span><div id="busy">טוען…</div></div>
<div class="tools"><span>לפני</span><input type="range" id="ba" min="0" max="1000" value="1000"><span>אחרי</span>
<button id="zin">＋</button><button id="zout">－</button></div>
<div class="tools"><button id="mAccent">🎯 בחר קיר מודגש</button><button id="mPersp">📐 כיול פרספקטיבה</button>
<span id="drawTools" style="display:none"><select id="region"></select><button id="pClose">✔ סגור צורה</button><button id="pUndo">↶</button><button id="pClear">🗑</button></span></div>
<div id="hint"></div>
<div id="thumbs"></div></div>
<div id="panel"></div></main>
<script>
const PH=[84,85,86,87],A='assets/';
const REG=['walls','floor','ceiling','stairs','sofa','curtains','tv'],RL={walls:'קירות',floor:'רצפה',ceiling:'תקרה',stairs:'מדרגות',sofa:'ספה',curtains:'וילונות',tv:'מזנון',accent:'קיר מודגש'};
const TEX={WoodFloor051:{n:'פרקט אלון',s:2.2},WoodFloor041:{n:'עץ כפרי',s:2},WoodFloor043:{n:'עץ אגוז',s:2.4},herring:{n:'אדרה (הרינגבון)',s:2.3},chevron:{n:'שברון',s:2.6},Tiles074:{n:'שחמט',s:1.2},Tiles101:{n:'אריח מצויר',s:1.2},Marble006:{n:'שיש שחור',s:1.6},Concrete034:{n:'בטון מוחלק',s:3}};
const PAL={walls:['#f3f1ec','#ebe2d2','#e3d3c0','#d8e1dc','#c7d3dc','#b9c4a7','#8fa6a3','#9d8c7e','#5b6b78','#33404d','#2a2a2c','#c98f6b'],
floor:['#e9dfcf','#d4b58c','#b98a5a','#8c5e3c','#5e3d26','#3a271b','#c9c6c0','#8d8a85','#4a4744','#efe9e1'],
ceiling:['#f7f7f5','#efe8dc','#dfe6ea','#2b2b2b'],stairs:['#d9b07a','#b07a43','#7a4a24','#4a2c17','#151515','#f3f1ea','#8a8a8a','#3d5a48'],
sofa:['#e9e3d8','#cfc2ab','#8b8f97','#3e4a5c','#26303f','#6b7f5e','#9b4e2e','#c9a227','#2b2b30','#b56576','#1f6f78','#5b3a5e'],
curtains:['#ffffff','#efe4cf','#c9b79c','#9fb1bc','#5d6d7e','#7d5a50','#2c2c2c','#b9c9a4','#d7a48b'],tv:['#f5f5f5','#1d1d1d','#8b5a2b','#c8a882','#4d5b63','#6e7f63','#a2a7ad'],
accent:['#2f4f4f','#1f3a5f','#7a3b2e','#c47a4a','#556b2f','#4b3b47','#151515','#b8860b','#d9a79a','#6c8ea0']};
const LIGHT={day:'☀️ יום',warm:'🕯️ חמים',cool:'❄️ קריר',golden:'🌅 שקיעה',evening:'🌙 ערב'};
// state: c_<reg>=color|'' , floorMode: orig|color|tex , tex, stain
const DEF={floorMode:'orig',tex:'WoodFloor051',stain:'',light:'day',photo:'0'};REG.concat('accent').forEach(r=>DEF['c_'+r]='');
const PRE={'סקנדינבי':{c_walls:'#f3f1ec',floorMode:'tex',tex:'WoodFloor051',stain:'',c_stairs:'#d9b07a',c_sofa:'#e9e3d8',c_curtains:'#ffffff',c_tv:'#c8a882',light:'day'},
'תעשייתי':{c_walls:'#8d8a85',c_accent:'#33404d',floorMode:'tex',tex:'Concrete034',c_stairs:'#151515',c_sofa:'#2b2b30',c_curtains:'#5d6d7e',c_tv:'#1d1d1d',light:'cool'},
'בוהו':{c_walls:'#e3d3c0',c_accent:'#c47a4a',floorMode:'tex',tex:'herring',stain:'#b98a5a',c_stairs:'#7a4a24',c_sofa:'#c9a227',c_curtains:'#efe4cf',c_tv:'#8b5a2b',light:'warm'},
'מודרני כהה':{c_walls:'#33404d',c_accent:'#151515',floorMode:'tex',tex:'chevron',stain:'#3a271b',c_stairs:'#151515',c_sofa:'#8b8f97',c_curtains:'#2c2c2c',c_tv:'#1d1d1d',c_ceiling:'#efe8dc',light:'evening'},
'ים תיכוני':{c_walls:'#f3f1ec',c_accent:'#1f3a5f',floorMode:'tex',tex:'Tiles101',c_stairs:'#f3f1ea',c_sofa:'#9fb1bc',c_curtains:'#ffffff',c_tv:'#f5f5f5',light:'golden'},
'יוקרה':{c_walls:'#ebe2d2',c_accent:'#2a2a2c',floorMode:'tex',tex:'Marble006',c_stairs:'#151515',c_sofa:'#26303f',c_curtains:'#c9b79c',c_tv:'#1d1d1d',light:'warm'}};
let S=Object.assign({},DEF);const qs=new URLSearchParams(location.search);for(const k in DEF)if(qs.has(k))S[k]=qs.get(k);
// ---------- GL
const cv=document.getElementById('gl'),gl=cv.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false});
const VS='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D ph,ma,mb,mc,ac,ft;uniform vec3 col[8];uniform float on[8],mean[8];
uniform mat3 Hi;uniform float fmode,tscale,tmean,stainOn,split;uniform vec3 stain,lt;uniform float dark;uniform vec2 asp;
vec3 lin(vec3 c){return pow(c,vec3(2.2));}vec3 srgb(vec3 c){return pow(clamp(c,0.,1.),vec3(1./2.2));}
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}

void main(){vec3 o=lin(texture2D(ph,v).rgb);float L=lum(o);
 if(v.x>split){gl_FragColor=vec4(srgb(o),1);return;}
 vec3 a=texture2D(ma,v).rgb,b=texture2D(mb,v).rgb;vec3 mcc=texture2D(mc,v).rgb;float tv=mcc.r,acm=texture2D(ac,v).r;float Ls=max(lin(vec3(mcc.g)).r,1e-4);float det=clamp(L/Ls,.3,2.5);
 vec3 c=o;float w[7];w[0]=a.r;w[1]=a.g;w[2]=a.b;w[3]=b.r;w[4]=b.g;w[5]=b.b;w[6]=tv;
 float wa=a.r*acm;
 for(int i=0;i<7;i++){ if(i==1){
   if(fmode>1.5){vec3 q=Hi*vec3(v*asp,1.);vec2 uv=q.xy/q.z/tscale;
     vec3 t=lin(texture2D(ft,uv).rgb);if(stainOn>.5)t=lin(stain)*(lum(t)/tmean)*.9;
     float sh=clamp(pow(Ls/mean[1],.5),.3,1.2)*pow(det,.18);float spec=max(0.,Ls/mean[1]-1.3)*.35+max(0.,det-1.25)*.25;vec3 nf=t*sh/1.05+spec*.25;c=mix(c,nf,w[1]);c=mix(c,mix(nf*vec3(.80,.93,.86),o,.5)+vec3(max(L-Ls,0.))*1.5,mcc.b);}
   else if(fmode>.5){vec3 nf=lin(col[1])*min(L/mean[1],3.);c=mix(c,nf,w[1]);c=mix(c,mix(lin(col[1])*min(Ls/mean[1],2.)*vec3(.80,.93,.86),o,.5)+vec3(max(L-Ls,0.))*1.5,mcc.b);}
  } else if(on[i]>.5){vec3 nc=(i==3)?lin(col[i])*pow(min(Ls/mean[i],4.),.8)*pow(det,.55):(i==4)?lin(col[i])*pow(min(Ls/mean[i],3.),.9)*pow(det,.8):lin(col[i])*min(L/mean[i],3.);c=mix(c,nc,w[i]);} }
 if(on[7]>.5)c=mix(c,lin(col[7])*min(L/mean[0],3.),wa);
 c*=lt;if(dark>0.){float d=distance(v,vec2(.5,.25));c*=mix(1.,.35+.9*exp(-d*d*6.),dark);}
 float lc=lum(c);if(lc>.75){float t=.75+.25*(1.-exp(-(lc-.75)/.25));c*=t/lc;}gl_FragColor=vec4(srgb(c),1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);const T={};
function tex(unit,name,src,repeat){gl.activeTexture(gl.TEXTURE0+unit);let t=T[name]||(T[name]=gl.createTexture());gl.bindTexture(gl.TEXTURE_2D,t);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
if(repeat){gl.generateMipmap(gl.TEXTURE_2D);{const ax=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');if(ax)gl.texParameterf(gl.TEXTURE_2D,ax.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(16,gl.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));}gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
const ext=gl.getExtension('EXT_texture_filter_anisotropic');if(ext)gl.texParameterf(gl.TEXTURE_2D,ext.TEXTURE_MAX_ANISOTROPY_EXT,8)}
else{gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.uniform1i(U(name),unit)}
['ph','ma','mb','mc','ac','ft'].forEach((n,i)=>gl.uniform1i(U(n),i));
const load=s=>new Promise((r,j)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=j;i.src=s});
// ---------- floor textures
const texCache={};
async function floorTex(name){if(texCache[name])return texCache[name];let c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');
{const i=await load(A+name+'.jpg');x.drawImage(i,0,0,1024,1024)}
const d=x.getImageData(0,0,1024,1024).data;let s=0;for(let i=0;i<d.length;i+=4*97){const l=.2126*(d[i]/255)**2.2+.7152*(d[i+1]/255)**2.2+.0722*(d[i+2]/255)**2.2;s+=l}
return texCache[name]={c,mean:s/(d.length/4/97)}}
// ---------- photos
let cur=null,meta={};const PERSP={84:[[.43,.5],[.8,.47],[1.08,.82],[.22,.67],3.5,3],85:[[.42,.55],[.76,.535],[1.0,.98],[.12,.92],3.5,4],86:[[.15,.6],[.62,.585],[1.05,.98],[-.15,.97],4,3.5],87:[[.294,.5],[.644,.5],[1.3,1.0],[-.3,1.0],2.2,3.5]};
function homog(src,dst){// src->dst 4pts, returns 3x3 row-major
const M=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];M.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);M.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
for(let i=0;i<8;i++){let p=i;for(let r=i+1;r<8;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];[b[i],b[p]]=[b[p],b[i]];
for(let r=0;r<8;r++)if(r!=i){const f=M[r][i]/M[i][i];for(let c=i;c<8;c++)M[r][c]-=f*M[i][c];b[r]-=f*b[i]}}
const h=b.map((x,i)=>x/M[i][i]);return[...h,1]}
let maskCanvases=null,photoImg=null,accCanvas=document.createElement('canvas');
async function setPhoto(idx){busy(1);S.photo=String(idx);document.querySelectorAll('#thumbs img').forEach((t,i)=>t.classList.toggle('on',i==idx));
const n=PH[idx];if(!meta[84])meta=await (await fetch(A+'meta.json')).json();
const [p,a,b,c]=await Promise.all(['p'+n+'.jpg','m'+n+'a.png','m'+n+'b.png','m'+n+'c.png'].map(f=>load(A+f)));
cur={n,w:p.width,h:p.height,mean:REG.map(r=>Math.max(.01,meta[n][r])),persp:JSON.parse(localStorage['persp'+n]||'null')||PERSP[n],own:false};
photoImg=p;maskCanvases={a,b,c};cv.width=p.width;cv.height=p.height;ov.width=p.width/2;ov.height=p.height/2;
tex(0,'ph',p);tex(1,'ma',a);tex(2,'mb',b);tex(3,'mc',c);resetAccent();drawTools.style.display='none';busy(0);await render()}
function resetAccent(data){accCanvas.width=600;accCanvas.height=450;const x=accCanvas.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,600,450);if(data)x.putImageData(data,0,0);tex(4,'ac',accCanvas)}
// ---------- render
let rq=0;async function render(){if(!cur)return;const my=++rq;
let ft=null;if(S.floorMode=='tex'){ft=await floorTex(S.tex);if(my!=rq)return;if(T._ftName!=S.tex){tex(5,'ft',ft.c,true);T._ftName=S.tex}}
gl.viewport(0,0,cv.width,cv.height);
const hx=h=>{h=h||'#888888';return[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255)};
const cols=[],ons=[],means=[];REG.forEach((r,i)=>{cols.push(...hx(S['c_'+r]));ons.push(S['c_'+r]?1:0);means.push(cur.mean[i])});
cols.push(...hx(S.c_accent));ons.push(S.c_accent?1:0);means.push(cur.mean[0]);
if(S.floorMode=='color'){cols.splice(3,3,...hx(S.c_floor||'#b98a5a'))}
gl.uniform3fv(U('col'),cols);gl.uniform1fv(U('on'),ons);gl.uniform1fv(U('mean'),means);
gl.uniform1f(U('fmode'),{orig:0,color:1,tex:2}[S.floorMode]);
const as=cur.w/cur.h,P=cur.persp;const H=homog([P[0],P[1],P[2],P[3]].map(([x,y])=>[x*as,y]),[[0,0],[P[4],0],[P[4],P[5]],[0,P[5]]]);

gl.uniformMatrix3fv(U('Hi'),false,[H[0],H[3],H[6],H[1],H[4],H[7],H[2],H[5],H[8]]);gl.uniform2f(U('asp'),as,1);
gl.uniform1f(U('tscale'),ft?TEX[S.tex].s:1);gl.uniform1f(U('tmean'),ft?ft.mean:.2);gl.uniform1f(U('stainOn'),S.stain?1:0);gl.uniform3fv(U('stain'),hx(S.stain));
const LT={day:[1,1,1],warm:[1.06,1,.9],cool:[.9,.98,1.12],golden:[1.1,.97,.8],evening:[.95,.8,.6]};gl.uniform3fv(U('lt'),LT[S.light]);gl.uniform1f(U('dark'),S.light=='evening'?1:S.light=='golden'?.35:0);
gl.uniform1f(U('split'),ba.value/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);drawOv()}
// ---------- overlay: perspective handles / polygons
const ov=document.getElementById('ov'),ox=ov.getContext('2d');let mode='',poly=[],polys={};
function drawHv(){const hv=document.getElementById('hv');hv.style.display=mode=='persp'?'':'none';if(mode!='persp')return;const r=view.getBoundingClientRect(),dp=devicePixelRatio||1;hv.width=r.width*dp;hv.height=r.height*dp;const x=hv.getContext('2d');x.scale(dp,dp);
const P=cur.persp.slice(0,4).map(([u,v])=>[Z.x+u*r.width*Z.s,Z.y+v*r.height*Z.s]);x.fillStyle='rgba(0,0,0,.25)';x.strokeStyle='#0ff';x.lineWidth=3;x.beginPath();P.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fill();x.stroke();
x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1;x.strokeRect(Z.x,Z.y,r.width*Z.s,r.height*Z.s);P.forEach(([px,py],i)=>{x.fillStyle='rgba(0,255,255,.35)';x.beginPath();x.arc(px,py,26,0,7);x.fill();x.fillStyle='#0ff';x.beginPath();x.arc(px,py,9,0,7);x.fill();x.fillStyle='#000';x.font='bold 13px sans-serif';x.fillText(i+1,px-4,py+5)})}
function drawOv(){drawHv();ox.clearRect(0,0,ov.width,ov.height);const W=ov.width,H=ov.height;
const s=ba.value/1000;if(s<1){ox.fillStyle='#e0a84f';ox.fillRect(s*W-2,0,4,H)}
if(false){const P=cur.persp;ox.strokeStyle='#0ff';ox.lineWidth=3;ox.beginPath();P.slice(0,4).forEach(([x,y],i)=>i?ox.lineTo(x*W,y*H):ox.moveTo(x*W,y*H));ox.closePath();ox.stroke();
P.slice(0,4).forEach(([x,y],i)=>{ox.fillStyle='#0ff';ox.beginPath();ox.arc(x*W,y*H,16,0,7);ox.fill();ox.fillStyle='#000';ox.font='bold 16px sans-serif';ox.fillText(i+1,x*W-5,y*H+6)})}
if(cur&&cur.own){const k=region.value;[polys[k]||[],poly].forEach((m,j)=>{if(!m.length)return;ox.strokeStyle=j?'#ff0':'#e0a84f';ox.lineWidth=3;ox.setLineDash([10,6]);ox.beginPath();m.forEach(([x,y],i)=>i?ox.lineTo(x*W,y*H):ox.moveTo(x*W,y*H));if(!j)ox.closePath();ox.stroke();ox.setLineDash([]);m.forEach(([x,y])=>{ox.fillStyle='#fff';ox.beginPath();ox.arc(x*W,y*H,7,0,7);ox.fill()})})}}
// ---------- zoom/pan
const view=document.getElementById('view'),inner=document.getElementById('inner');let Z={s:1,x:0,y:0};
function applyZ(){const r=view.getBoundingClientRect();if(mode=='persp'){Z.s=Math.max(.3,Math.min(8,Z.s))}else{Z.s=Math.max(1,Math.min(8,Z.s));Z.x=Math.min(0,Math.max(r.width*(1-Z.s),Z.x));Z.y=Math.min(0,Math.max(r.height*(1-Z.s),Z.y))}inner.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;drawHv()}
function zoomAt(f,cx,cy){Z.x=cx-(cx-Z.x)*f;Z.y=cy-(cy-Z.y)*f;Z.s*=f;applyZ()}
zin.onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1.6,r.width/2,r.height/2)};zout.onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1/1.6,r.width/2,r.height/2)};
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();let drag=null,moved=0;
function norm(e){const r=inner.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
 if(mode=='persp'){const r=view.getBoundingClientRect(),vx=e.clientX-r.left,vy=e.clientY-r.top;let bi=-1,bd=40;cur.persp.slice(0,4).forEach(([u,v],i)=>{const d=Math.hypot(Z.x+u*r.width*Z.s-vx,Z.y+v*r.height*Z.s-vy);if(d<bd){bd=d;bi=i}});if(bi>=0)drag=bi}});
view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const old=pts.get(e.pointerId);const dx=e.clientX-old[0],dy=e.clientY-old[1];moved+=Math.abs(dx)+Math.abs(dy);
 if(drag!=null){cur.persp[drag]=norm(e);render();pts.set(e.pointerId,[e.clientX,e.clientY]);return}
 if(pts.size==2){const [a,b]=[...pts.values()];const d0=Math.hypot(a[0]-b[0],a[1]-b[1]);pts.set(e.pointerId,[e.clientX,e.clientY]);const [c,d]=[...pts.values()];const d1=Math.hypot(c[0]-d[0],c[1]-d[1]);const r=view.getBoundingClientRect();zoomAt(d1/d0,(c[0]+d[0])/2-r.left,(c[1]+d[1])/2-r.top);return}
 pts.set(e.pointerId,[e.clientX,e.clientY]);if(Z.s>1){Z.x+=dx;Z.y+=dy;applyZ()}});
view.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(drag!=null){localStorage['persp'+cur.n]=JSON.stringify(cur.persp);drag=null;return}
 if(moved<8)tap(norm(e))});
function tap(p){if(mode=='accent')accentFill(p);else if(cur&&cur.own&&mode=='draw'){poly.push(p);drawOv()}}
// ---------- accent wall: flood fill on walls mask + color edges
function accentFill([u,v]){const W=600,H=450,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
x.drawImage(maskCanvases.a,0,0,W,H);const m=x.getImageData(0,0,W,H).data;x.drawImage(photoImg,0,0,W,H);const im=x.getImageData(0,0,W,H).data;
const sx=u*W|0,sy=v*H|0,si=(sy*W+sx);if(m[si*4]<128){hint.textContent='זה לא קיר – הקש על קיר 🙂';return}
const out=new Uint8Array(W*H),st=[si];out[si]=1;const lum=i=>im[i*4]*.3+im[i*4+1]*.59+im[i*4+2]*.11;
while(st.length){const i=st.pop(),xx=i%W,yy=i/W|0;for(const j of[i-1,i+1,i-W,i+W]){if(j<0||j>=W*H||out[j])continue;if(Math.abs((j%W)-xx)>1)continue;
 if(m[j*4]>110&&Math.abs(lum(j)-lum(i))<5){out[j]=1;st.push(j)}}}
const ac=accCanvas.getContext('2d'),d=ac.getImageData(0,0,W,H);for(let i=0;i<W*H;i++)if(out[i]){d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=255}
ac.putImageData(d,0,0);ac.filter='blur(1.5px)';ac.drawImage(accCanvas,0,0);ac.filter='none';tex(4,'ac',accCanvas);if(!S.c_accent)S.c_accent=PAL.accent[0];panel();render();hint.textContent='✅ קיר מודגש נבחר. אפשר להקיש על עוד קירות או לבחור צבע.'}
// ---------- own photo
async function ownPhoto(file){busy(1);const i=await load(URL.createObjectURL(file));const sc=Math.min(1,2400/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*sc;c.height=i.height*sc;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
photoImg=c;cv.width=c.width;cv.height=c.height;ov.width=c.width/2;ov.height=c.height/2;view.style.aspectRatio=c.width+'/'+c.height;
cur={n:'own',w:c.width,h:c.height,mean:REG.map(()=>.3),persp:[[.3,.55],[.7,.55],[1,1],[0,1],4,4],own:true};polys={};poly=[];buildOwnMasks();tex(0,'ph',c);resetAccent();
document.querySelectorAll('#thumbs img').forEach(t=>t.classList.remove('on'));drawTools.style.display='';setMode('draw');busy(0);render()}
function buildOwnMasks(){const W=cur.w,H=cur.h;const mk=keys=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';x.filter='blur(2px)';
 keys.forEach((k,ch)=>{const p=polys[k];if(!p||p.length<3)return;x.fillStyle=['#f00','#0f0','#00f'][ch];x.beginPath();p.forEach(([u,v],i)=>i?x.lineTo(u*W,v*H):x.moveTo(u*W,v*H));x.fill()});return c};
const a=mk(['walls','floor','ceiling']),b=mk(['stairs','sofa','curtains']),c=mk(['tv']);maskCanvases={a,b,c};tex(1,'ma',a);tex(2,'mb',b);tex(3,'mc',c);
// region means
const s=document.createElement('canvas');s.width=200;s.height=150;const x=s.getContext('2d');x.drawImage(photoImg,0,0,200,150);const im=x.getImageData(0,0,200,150).data;
const ms=[a,b,c].map(m=>{x.drawImage(m,0,0,200,150);return x.getImageData(0,0,200,150).data});
REG.forEach((r,ri)=>{const src=ms[ri<3?0:ri<6?1:2],ch=ri<3?ri:ri<6?ri-3:0;let L=[];for(let i=0;i<200*150;i++)if(src[i*4+ch]>150)L.push(.2126*(im[i*4]/255)**2.2+.7152*(im[i*4+1]/255)**2.2+.0722*(im[i*4+2]/255)**2.2);
 L.sort((p,q)=>p-q);if(L.length>10)cur.mean[ri]=Math.max(.01,L[L.length>>1])})}
// ---------- UI
const hint=document.getElementById('hint'),ba=document.getElementById('ba'),region=document.getElementById('region'),drawTools=document.getElementById('drawTools');
region.innerHTML=REG.map(r=>`<option value="${r}">${RL[r]}</option>`).join('');region.onchange=()=>{poly=[];drawOv()};
pClose.onclick=()=>{if(poly.length>2){polys[region.value]=poly;poly=[];buildOwnMasks();if(!S['c_'+region.value]&&region.value!='floor')S['c_'+region.value]=PAL[region.value][3];if(region.value=='floor'&&S.floorMode=='orig')S.floorMode='color';panel();render()}};
pUndo.onclick=()=>{poly.pop();drawOv()};pClear.onclick=()=>{delete polys[region.value];poly=[];buildOwnMasks();render()};
function setMode(m){mode=mode==m?'':m;{const r=view.getBoundingClientRect();if(mode=='persp'){Z.s=.55;Z.x=r.width*.225;Z.y=r.height*.225}else{Z.s=1;Z.x=0;Z.y=0}applyZ()}mAccent.classList.toggle('on',mode=='accent');mPersp.classList.toggle('on',mode=='persp');
hint.textContent={accent:'הקש על קיר בתמונה כדי להפוך אותו לקיר מודגש',persp:'גרור את 4 הנקודות (גם מחוץ לתמונה) כך שהקווים יקבילו לקווי הקירות/הרצפה. הריצוף מתיישר בזמן אמת. לחץ שוב על הכפתור לסיום.',draw:'הקש נקודות סביב אזור, ואז "סגור צורה". בחר אזור מהרשימה.','':''}[mode];drawOv()}
mAccent.onclick=()=>setMode('accent');mPersp.onclick=()=>{if(S.floorMode!='tex'){S.floorMode='tex';panel();render()}setMode('persp')};
ba.oninput=render;
function busy(b){document.getElementById('busy').style.display=b?'flex':'none'}
function sw(key,list){return'<div class="sw">'+list.map(c=>`<span data-k="${key}" data-v="${c}" class="${S[key]==c?'on':''}" style="background:${c}"></span>`).join('')+`<input type="color" data-k="${key}" value="${S[key]||'#888888'}"></div>`}
function panel(){let h='<div class="sec"><h3>✨ סגנונות מוכנים</h3><div class="row">'+Object.keys(PRE).map(n=>`<button data-p="${n}">${n}</button>`).join('')+'</div></div>';
h+=`<div class="sec"><h3>🪵 רצפה</h3><div class="row">${[['orig','מקורית'],['color','צביעה (שומר מרקם)'],['tex','החלפת ריצוף']].map(([v,l])=>`<button data-k="floorMode" data-v="${v}" class="${S.floorMode==v?'on':''}">${l}</button>`).join('')}</div>`;
if(S.floorMode=='color')h+='<div class="row"></div>'+sw('c_floor',PAL.floor);
if(S.floorMode=='tex'){h+='<div class="sw" style="margin-top:8px">'+Object.entries(TEX).map(([k,t])=>`<span class="tx ${S.tex==k?'on':''}" data-k="tex" data-v="${k}" title="${t.n}" style="background-image:url(${A+k}.jpg)"></span>`).join('')+'</div><div style="font-size:12px;color:#aaa;margin:6px 0 2px">'+TEX[S.tex].n+' · גוון עץ:</div>'+
 '<div class="sw"><span data-k="stain" data-v="" class="'+(S.stain?'':'on')+'" title="טבעי" style="background:conic-gradient(#d4b58c,#8c5e3c,#d4b58c)"></span>'+PAL.floor.map(c=>`<span data-k="stain" data-v="${c}" class="${S.stain==c?'on':''}" style="background:${c}"></span>`).join('')+'</div>'}
h+='</div>';
for(const r of['walls','accent','stairs','sofa','curtains','tv','ceiling']){h+=`<div class="sec"><h3>${{walls:'🎨',accent:'🎯',stairs:'🪜',sofa:'🛋️',curtains:'🪟',tv:'📺',ceiling:'⬜'}[r]} ${RL[r]} <button data-k="c_${r}" data-v="" style="padding:3px 8px;font-size:12px">מקורי</button></h3>`+sw('c_'+r,PAL[r])+(r=='accent'?'<div style="font-size:12px;color:#aaa;margin-top:6px">לחץ "🎯 בחר קיר מודגש" והקש על קיר בתמונה</div>':'')+'</div>'}
h+='<div class="sec"><h3>💡 תאורה</h3><div class="row">'+Object.entries(LIGHT).map(([k,l])=>`<button data-k="light" data-v="${k}" class="${S.light==k?'on':''}">${l}</button>`).join('')+'</div></div>';
document.getElementById('panel').innerHTML=h}
document.getElementById('panel').addEventListener('click',e=>{const t=e.target.closest('[data-k],[data-p]');if(!t)return;
if(t.dataset.p){const keepPh=S.photo;S=Object.assign({},DEF,PRE[t.dataset.p],{photo:keepPh})}else if(t.tagName!='INPUT'){S[t.dataset.k]=t.dataset.v;if(t.dataset.k=='c_floor')S.floorMode='color'}else return;panel();render()});
document.getElementById('panel').addEventListener('input',e=>{if(e.target.type=='color'){S[e.target.dataset.k]=e.target.value;render()}});
document.getElementById('panel').addEventListener('change',e=>{if(e.target.type=='color')panel()});
surprise.onclick=()=>{const pick=a=>a[Math.random()*a.length|0];['walls','stairs','sofa','curtains','tv'].forEach(r=>S['c_'+r]=Math.random()<.85?pick(PAL[r]):'');S.c_accent=Math.random()<.5?pick(PAL.accent):'';
S.floorMode=pick(['tex','tex','color']);S.tex=pick(Object.keys(TEX));S.stain=Math.random()<.5?pick(PAL.floor):'';S.c_floor=pick(PAL.floor);S.light=pick(Object.keys(LIGHT));panel();render()};
reset.onclick=()=>{const p=S.photo;S=Object.assign({},DEF,{photo:p});panel();render()};
share.onclick=()=>{const o={};for(const k in S)if(S[k]!==DEF[k])o[k]=S[k];const u=location.origin+location.pathname+'?'+new URLSearchParams(o);history.replaceState(0,'',u);
if(navigator.share)navigator.share({title:'העיצוב שלי לסלון',url:u}).catch(()=>{});else navigator.clipboard.writeText(u).then(()=>hint.textContent='🔗 הקישור הועתק!')};
dl.onclick=()=>{const v=ba.value;ba.value=1000;render().then(()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='salon-design.jpg';a.click();ba.value=v;render()},'image/jpeg',.93)})};
// thumbs
document.getElementById('thumbs').innerHTML=PH.map((n,i)=>`<img src="${A}p${n}.jpg" data-i="${i}" loading="lazy">`).join('')+'<label>📷 התמונה שלי<input type="file" accept="image/*" hidden id="file"></label>';
document.getElementById('thumbs').addEventListener('click',e=>{if(e.target.dataset.i!=null){view.style.aspectRatio='4/3';setPhoto(+e.target.dataset.i)}});
file.onchange=e=>e.target.files[0]&&ownPhoto(e.target.files[0]);
addEventListener('resize',applyZ);view.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});panel();setPhoto(+S.photo||0);
</script></body></html>
