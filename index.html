<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>סימולטור עיצוב סלון</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Arial;background:#14161c;color:#eee}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1d2029;position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}button{background:#2c3140;color:#eee;border:0;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
button.on,button:hover{background:#e0a84f;color:#111}main{display:flex;flex-wrap:wrap}
#stage{flex:2 1 520px;position:relative;padding:8px}#stage canvas{width:100%;border-radius:14px;display:block;touch-action:none}
#panel{flex:1 1 300px;padding:8px 12px;max-height:calc(100vh - 60px);overflow:auto}
.sec{background:#1d2029;border-radius:14px;padding:10px;margin-bottom:10px}.sec h3{margin:0 0 8px;font-size:15px}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw span{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px #0006}
.sw span.on{border-color:#e0a84f}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#tabs{display:flex;gap:6px;margin-bottom:8px}#slider{position:absolute;inset:8px;pointer-events:none}
#hint{font-size:13px;color:#aaa;margin:6px 2px}input[type=range]{width:100%}
</style></head><body>
<header><h1>🛋️ מעצב הסלון</h1>
<button id="surprise">🎲 הפתע אותי</button><button id="share">🔗 שתף</button><button id="dl">⬇️ הורד</button></header>
<main><div id="stage"><div id="tabs"><button data-m="sim" class="on">סלון תלת-ממדי</button><button data-m="photo">📷 התמונה שלי</button></div>
<canvas id="cv" width="1200" height="800"></canvas>
<div id="photoUI" style="display:none"><div class="row"><input type="file" id="file" accept="image/*">
<select id="region"></select><button id="close">סגור צורה ✔</button><button id="undo">↶ בטל נקודה</button><button id="clearR">🗑 נקה אזור</button><button id="edit">✋ עריכת נקודות</button></div>
<div id="hint">העלה תמונה של הסלון, בחר אזור (רצפה/קיר/מדרגות...) והקש נקודות סביבו. אחר כך בחר צבעים מהפאנל.</div>
<label>לפני / אחרי <input type="range" id="ba" min="0" max="100" value="100"></label></div></div>
<div id="panel"></div></main>
<script>
const R={floor:'רצפה',walls:'קירות',accent:'קיר מודגש',stairs:'מדרגות',sofa:'ספה',curtains:'וילונות',tv:'מזנון',ceiling:'תקרה'};
const OPT={
floorType:{label:'סוג רצפה',v:{planks:'פרקט קרשים',herring:'אדרה (הרינגבון)',chevron:'שברון',tiles:'אריחים',concrete:'בטון מוחלק'}},
floor:{label:'צבע רצפה',v:['#c9c6c0','#e6d8bf','#c49a6c','#9b6b43','#6b4426','#3d2a1e','#8e8a84','#d9d4cc','#a7a39b','#5b5650']},
walls:{label:'צבע קירות',v:['#f4f2ee','#ece3d3','#dfe7e3','#c9d6df','#e9d5cc','#b9c4a7','#8fa3a8','#3c4a57','#2b2b2e','#d8b98a']},
accent:{label:'קיר מודגש (אחורי)',v:['same','#2f4f4f','#1f3a5f','#7a3b2e','#c47a4a','#556b2f','#4b3b47','#111','#b8860b','#e0b0a0']},
stairs:{label:'מדרגות',v:['#b07a43','#d4a56a','#7a4a24','#4a2c17','#1b1b1b','#f2f0ea','#8c8c8c','#3e5641']},
sofa:{label:'ספה',v:['#d8ccb8','#ece7de','#8a8f99','#3e4a5c','#6b7f5e','#a0522d','#c9a227','#2e2e33','#b56576','#1f6f78']},
curtains:{label:'וילונות',v:['#ffffff','#f1e6d0','#c9b79c','#9fb1bc','#5d6d7e','#7d5a50','#2c2c2c','#b9c9a4']},
tv:{label:'מזנון טלוויזיה',v:['#f5f5f5','#1e1e1e','#8b5a2b','#c8a882','#4d5b63','#6e7f63']},
ceiling:{label:'תקרה',v:['#f7f7f5','#efe8dc','#2a2a2a','#dfe6ea']},
rug:{label:'שטיח',v:['none','#c8b6a6','#7b8c7a','#a44a3f','#2f3e56','#e8e2d6','#d9a441']},
light:{label:'תאורה',v:{day:'☀️ יום',warm:'🕯️ חמים',cool:'❄️ קריר',evening:'🌙 ערב'}},
plants:{label:'צמחים',v:{0:'בלי',1:'קצת',2:'ג׳ונגל'}}};
const PRESETS={'סקנדינבי':{floorType:'planks',floor:'#e6d8bf',walls:'#f4f2ee',accent:'same',stairs:'#d4a56a',sofa:'#ece7de',curtains:'#ffffff',tv:'#c8a882',ceiling:'#f7f7f5',rug:'#e8e2d6',light:'day',plants:'1'},
'תעשייתי':{floorType:'concrete',floor:'#8e8a84',walls:'#c9d6df',accent:'#3c4a57',stairs:'#1b1b1b',sofa:'#2e2e33',curtains:'#5d6d7e',tv:'#1e1e1e',ceiling:'#2a2a2a',rug:'#2f3e56',light:'cool',plants:'0'},
'בוהו':{floorType:'herring',floor:'#c49a6c',walls:'#e9d5cc',accent:'#c47a4a',stairs:'#7a4a24',sofa:'#c9a227',curtains:'#f1e6d0',tv:'#8b5a2b',ceiling:'#efe8dc',rug:'#a44a3f',light:'warm',plants:'2'},
'מודרני כהה':{floorType:'chevron',floor:'#3d2a1e',walls:'#2b2b2e',accent:'#111',stairs:'#1b1b1b',sofa:'#3e4a5c',curtains:'#2c2c2c',tv:'#1e1e1e',ceiling:'#2a2a2a',rug:'#c8b6a6',light:'evening',plants:'1'},
'מקורי':{floorType:'tiles',floor:'#d9d4cc',walls:'#f4f2ee',accent:'same',stairs:'#b07a43',sofa:'#d8ccb8',curtains:'#ffffff',tv:'#f5f5f5',ceiling:'#f7f7f5',rug:'none',light:'day',plants:'0'}};
let S=Object.assign({},PRESETS['מקורי']);
const q=new URLSearchParams(location.search);for(const k in OPT)if(q.get(k))S[k]=q.get(k);
const cv=document.getElementById('cv'),c=cv.getContext('2d');let mode='sim';
// ---------- panel
function panel(){const p=document.getElementById('panel');let h='<div class="sec"><h3>✨ סגנונות מוכנים</h3><div class="row">'+Object.keys(PRESETS).map(n=>`<button data-p="${n}">${n}</button>`).join('')+'</div></div>';
for(const k in OPT){const o=OPT[k];h+=`<div class="sec"><h3>${o.label}</h3>`;
if(Array.isArray(o.v))h+='<div class="sw">'+o.v.map(v=>`<span data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}" style="background:${v=='same'||v=='none'?'repeating-linear-gradient(45deg,#555 0 4px,#888 4px 8px)':v}" title="${v=='same'?'כמו שאר הקירות':v=='none'?'בלי':v}"></span>`).join('')+`<input type="color" data-k="${k}" value="${/^#/.test(S[k])?S[k]:'#888888'}"></div>`;
else h+='<div class="row">'+Object.entries(o.v).map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}">${l}</button>`).join('')+'</div>';h+='</div>'}
p.innerHTML=h;}
document.getElementById('panel').addEventListener('click',e=>{const t=e.target;if(t.dataset.p){S=Object.assign({},PRESETS[t.dataset.p]);upd()}else if(t.dataset.k&&t.dataset.v!=null){S[t.dataset.k]=t.dataset.v;upd()}});
document.getElementById('panel').addEventListener('input',e=>{if(e.target.type=='color'){S[e.target.dataset.k]=e.target.value;draw()}});
function upd(){panel();draw()}
// ---------- helpers
function sh(hex,a){if(!/^#/.test(hex))return hex;let n=parseInt(hex.slice(1).padEnd(6,hex.slice(-1)),16);if(hex.length==4)n=parseInt(hex.slice(1).split('').map(x=>x+x).join(''),16);
let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return`rgb(${r},${g},${b})`}
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
// camera: floor point (x,z) y height -> screen
const W=1200,H=800,F=700,CY=330,CAMH=1.6;const P=(x,y,z)=>[W/2+x*F/z,CY+(CAMH-y)*F/z];
const RX=3.2,Z0=1.4,Z1=8,RH=2.7;
function poly(pts,fill,stroke){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
const fq=(x0,z0,x1,z1)=>[P(x0,0,z0),P(x1,0,z0),P(x1,0,z1),P(x0,0,z1)];
function floor(){const col=S.floor,t=S.floorType;seed=7;
c.save();c.beginPath();fq(-RX,Z0,RX,Z1).forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.clip();
poly(fq(-RX,Z0,RX,Z1),col);
const g='rgba(0,0,0,.18)';
if(t=='planks'){for(let x=-RX;x<RX;x+=.2){let z=Z0-rnd()*1.2;while(z<Z1){const L=.9+rnd()*.6;poly(fq(x,z,x+.2,z+L),sh(col,(rnd()-.5)*.16),g);z+=L}}}
else if(t=='herring'){const w=.1,l=.5;for(let row=-12;row<40;row++)for(let i=-20;i<20;i++){const bx=i*l*1, bz=Z0+row*w*2+i*0;const x0=i*.5-row*0+(row%2)*0;
const ox=i*.35,oz=Z0+row*.2+ (i%2?0:.1);seed+=1;
poly([P(ox,0,oz),P(ox+.35,0,oz+.35),P(ox+.35,0,oz+.45),P(ox,0,oz+.1)].map(p=>p),sh(col,(rnd()-.5)*.2),g);
poly([P(ox+.35,0,oz+.35),P(ox+.7,0,oz),P(ox+.7,0,oz+.1),P(ox+.35,0,oz+.45)],sh(col,(rnd()-.5)*.2),g);}}
else if(t=='chevron'){for(let z=Z0-1;z<Z1;z+=.14)for(let x=-RX-.5;x<RX;x+=.6){poly([P(x,0,z),P(x+.3,0,z+.25),P(x+.3,0,z+.39),P(x,0,z+.14)],sh(col,(rnd()-.5)*.2),g);poly([P(x+.3,0,z+.25),P(x+.6,0,z),P(x+.6,0,z+.14),P(x+.3,0,z+.39)],sh(col,(rnd()-.5)*.2),g)}}
else if(t=='tiles'){for(let x=-RX;x<RX;x+=.6)for(let z=Z0;z<Z1;z+=.6)poly(fq(x,z,x+.6,z+.6),sh(col,(rnd()-.5)*.06),'rgba(0,0,0,.25)')}
else{for(let i=0;i<500;i++){const x=-RX+rnd()*2*RX,z=Z0+rnd()*(Z1-Z0),[sx,sy]=P(x,0,z);c.fillStyle=`rgba(${rnd()<.5?0:255},${rnd()<.5?0:255},${rnd()<.5?0:255},.05)`;c.beginPath();c.ellipse(sx,sy,80*F/z/100,25*F/z/100,0,0,7);c.fill()}}
// reflection sheen
const gr=c.createLinearGradient(0,H,0,CY);gr.addColorStop(0,'rgba(0,0,0,.25)');gr.addColorStop(1,'rgba(255,255,255,.12)');c.fillStyle=gr;c.fillRect(0,0,W,H);c.restore()}
function room(){const wl=S.walls,ac=S.accent=='same'?wl:S.accent;
poly([P(-RX,RH,Z0),P(RX,RH,Z0),P(RX,RH,Z1),P(-RX,RH,Z1)],S.ceiling);
poly([P(-RX,0,Z0),P(-RX,0,Z1),P(-RX,RH,Z1),P(-RX,RH,Z0)],sh(wl,-.08));
poly([P(RX,0,Z0),P(RX,0,Z1),P(RX,RH,Z1),P(RX,RH,Z0)],sh(wl,-.14));
poly([P(-RX,0,Z1),P(RX,0,Z1),P(RX,RH,Z1),P(-RX,RH,Z1)],ac);
floor();
// skirting
poly([P(-RX,0,Z1),P(RX,0,Z1),P(RX,.08,Z1),P(-RX,.08,Z1)],'#fff');
// kitchen door on back wall
poly([P(1.4,0,Z1),P(2.4,0,Z1),P(2.4,2.1,Z1),P(1.4,2.1,Z1)],'#e9dcc2','#0003');
poly([P(1.55,.9,Z1),P(2.25,.9,Z1),P(2.25,1.6,Z1),P(1.55,1.6,Z1)],'#333');
// clock
let [cx,cy]=P(1.9,2.35,Z1);c.fillStyle='#fff';c.beginPath();c.arc(cx,cy,22,0,7);c.fill();c.lineWidth=3;c.strokeStyle='#222';c.stroke();c.beginPath();c.moveTo(cx,cy);c.lineTo(cx,cy-14);c.moveTo(cx,cy);c.lineTo(cx+10,cy+4);c.stroke();
// window w/ curtains on left wall
const wz0=2.2,wz1=4.2;poly([P(-RX,.9,wz0),P(-RX,.9,wz1),P(-RX,2.3,wz1),P(-RX,2.3,wz0)],'#bcd7ea');
const cu=S.curtains;for(let i=0;i<14;i++){const z=wz0-.4+i*(wz1-wz0+.8)/14;poly([P(-RX+.05,0.05,z),P(-RX+.05,.05,z+.18),P(-RX+.05,2.5,z+.18),P(-RX+.05,2.5,z)],sh(cu,i%2?-.08:.05)+'');}
c.globalAlpha=1;
// AC
poly([P(-RX+.01,2.1,5),P(-RX+.01,2.1,6),P(-RX+.01,2.4,6),P(-RX+.01,2.4,5)],'#f7f7f7','#0002');
}
function stairs(){const st=S.stairs,cx=-.6,cz=Z1-.9;const items=[];
for(let i=0;i<14;i++){const a=i*.45+.5,y=i*.19+.19;const r=.85;const a2=a+.45;
items.push({z:cz-Math.sin(a)*r*.6,d:()=>{poly([P(cx,y,cz),P(cx+Math.cos(a)*r,y,cz-Math.sin(a)*r*.6),P(cx+Math.cos(a2)*r,y,cz-Math.sin(a2)*r*.6)],sh(st,((i%3)-1)*.08),'#0004');
const[x1,y1]=P(cx+Math.cos(a)*r,y,cz-Math.sin(a)*r*.6),[x2,y2]=P(cx+Math.cos(a)*r,y+.9,cz-Math.sin(a)*r*.6);c.strokeStyle=sh(st,-.25);c.lineWidth=3;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}})}
items.sort((a,b)=>b.z-a.z).forEach(o=>o.d());
const[a,b]=P(cx,0,cz),[a2,b2]=P(cx,RH,cz);c.strokeStyle=sh(st,-.3);c.lineWidth=9;c.beginPath();c.moveTo(a,b);c.lineTo(a2,b2);c.stroke();
const[hx,hy]=P(cx,RH,cz);c.fillStyle='#0005';c.beginPath();c.ellipse(hx,hy,90,14,0,0,7);c.fill()}
function box(x0,x1,y0,y1,z0,z1,col){poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],sh(col,.1));
poly([P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)],col);
if(x0>0)poly([P(x0,y0,z0),P(x0,y0,z1),P(x0,y1,z1),P(x0,y1,z0)],sh(col,-.15));
if(x1<0)poly([P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0)],sh(col,-.15));}
function furniture(){const so=S.sofa;
if(S.rug!='none'){poly(fq(-1.9,3,.6,5.4),S.rug);poly(fq(-1.75,3.15,.45,5.25),sh(S.rug,.12));}
// L sofa along left wall + back
box(-RX+.05,-RX+1,0,.75,2.2,6.2,sh(so,-.1));box(-RX+.05,-RX+.3,0,.95,2.2,6.2,sh(so,-.2));
box(-RX+1,-.2,0,.75,5.3,6.2,sh(so,-.05));box(-RX+1,-.2,0,.95,6,6.2,sh(so,-.2));
for(let i=0;i<4;i++)box(-RX+.3,-RX+1,.4,.55,2.4+i*.9,3.2+i*.9,so);
for(let i=0;i<2;i++)box(-RX+1.05+i*1.05,-RX+2.05+i*1.05,.4,.55,5.3,6,so);
// glass table
const tg='rgba(170,220,200,.55)';box(-1.4,-.2,.45,.5,3.5,4.6,tg);
// TV unit on right
box(RX-.45,RX-.05,0,.45,2,5,S.tv);box(RX-.1,RX-.04,.9,1.6,2.6,4.4,'#111');
// plants
const n=+S.plants;const spots=[[RX-.4,6.8],[-RX+.4,1.8],[.6,7.4],[RX-.4,1.6]];
for(let i=0;i<n*2&&i<4;i++){const[x,z]=spots[i];box(x-.18,x+.18,0,.4,z-.18,z+.18,'#c96f47');const[px,py]=P(x,.9,z),s=F/z;
for(let j=0;j<9;j++){c.fillStyle=sh('#3f7d3a',(j%3-1)*.15);c.beginPath();c.ellipse(px+Math.cos(j)*s*.18,py+Math.sin(j*2)*s*.18,s*.16,s*.07,j,0,7);c.fill()}}
// chandelier
const[lx,ly]=P(-.3,RH-.25,4.2);c.strokeStyle='#ccc';c.lineWidth=2;for(let i=0;i<10;i++){c.beginPath();c.moveTo(lx,ly);c.lineTo(lx+Math.cos(i*.63)*50,ly+Math.sin(i*.63)*12);c.stroke()}
c.fillStyle='#fffbe0';c.beginPath();c.arc(lx,ly,8,0,7);c.fill()}
const LIGHT={day:null,warm:['rgba(255,170,80,.18)','soft-light'],cool:['rgba(120,170,255,.18)','soft-light'],evening:['rgba(20,25,60,.55)','multiply']};
function lighting(ctx){const L=LIGHT[S.light];if(!L)return;ctx.save();ctx.globalCompositeOperation=L[1];ctx.fillStyle=L[0];ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
if(S.light=='evening'){ctx.globalCompositeOperation='screen';const[lx,ly]=mode=='sim'?P(-.3,RH-.25,4.2):[ctx.canvas.width/2,ctx.canvas.height*.15];const g=ctx.createRadialGradient(lx,ly,0,lx,ly,ctx.canvas.width*.5);g.addColorStop(0,'rgba(255,200,120,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height)}
ctx.restore()}
function drawSim(){cv.width=W;cv.height=H;c.fillStyle='#000';c.fillRect(0,0,W,H);room();stairs();furniture();lighting(c);
const v=c.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.35)');c.fillStyle=v;c.fillRect(0,0,W,H)}
// ---------- photo mode
let img=null,masks=JSON.parse(localStorage.salonMasks||'{}'),cur=[],editMode=false,drag=null;
const regSel=document.getElementById('region');regSel.innerHTML=Object.entries(R).map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
const saveM=()=>localStorage.salonMasks=JSON.stringify(masks);
function pattern(){const t=document.createElement('canvas');t.width=t.height=256;const x=t.getContext('2d');x.fillStyle='#808080';x.fillRect(0,0,256,256);x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;seed=3;
if(S.floorType=='tiles'){for(let i=0;i<=256;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.moveTo(0,i);x.lineTo(256,i);x.stroke()}}
else if(S.floorType=='concrete'){for(let i=0;i<300;i++){x.fillStyle=`rgba(${rnd()<.5?0:255},0,0,.04)`.replace(',0,0',rnd()<.5?',0,0':',255,255');x.fillRect(rnd()*256,rnd()*256,20,6)}}
else{for(let i=0;i<8;i++)for(let j=0;j<4;j++){const g=110+rnd()*40|0;x.fillStyle=`rgb(${g},${g},${g})`;
if(S.floorType=='planks'){x.fillRect(j*64+(i%2)*32,i*32,64,32);x.strokeRect(j*64+(i%2)*32,i*32,64,32)}
else{x.save();x.translate(j*64+32,i*32+16);x.rotate(S.floorType=='herring'?(i+j)%2?.78:-.78:(j%2?.6:-.6));x.fillRect(-30,-7,60,14);x.strokeRect(-30,-7,60,14);x.restore()}}}
return t}
function drawPhoto(){if(!img){cv.width=W;cv.height=H;c.fillStyle='#222';c.fillRect(0,0,W,H);c.fillStyle='#aaa';c.font='32px system-ui';c.textAlign='center';c.fillText('📷 העלה תמונה של הסלון כדי להתחיל',W/2,H/2);return}
const w=Math.min(1600,img.width),h=img.height*w/img.width;cv.width=w;cv.height=h;c.drawImage(img,0,0,w,h);
const ba=+document.getElementById('ba').value/100;
const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.drawImage(img,0,0,w,h);
for(const k in R){const m=masks[k];if(!m||m.length<3)continue;let col=k=='accent'?(S.accent=='same'?null:S.accent):S[k];if(!col)continue;
x.save();x.beginPath();m.forEach((p,i)=>i?x.lineTo(p[0]*w,p[1]*h):x.moveTo(p[0]*w,p[1]*h));x.closePath();x.clip();
x.globalCompositeOperation='color';x.fillStyle=col;x.fillRect(0,0,w,h);

if(k=='floor'){x.globalCompositeOperation='overlay';x.globalAlpha=.5;const pt=x.createPattern(pattern(),'repeat');const ys=m.map(p=>p[1]*h),top=Math.min(...ys);
for(let y=top;y<h;y+=4){const s=.15+(y-top)/(h-top)*1.2;x.save();x.beginPath();x.rect(0,y,w,4);x.clip();x.translate(w/2,top);x.scale(s,s);x.fillStyle=pt;x.fillRect(-w/s,(y-top)/s-2,2*w/s,8/s);x.restore()}}
x.restore()}

m.forEach(p=>{c.fillStyle='#fff';c.beginPath();c.arc(p[0]*w,p[1]*h,editMode?9:4,0,7);c.fill()})})}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.addEventListener('pointerdown',e=>{if(mode!='photo'||!img)return;const p=pos(e);if(editMode){const m=masks[regSel.value]||[];let best=-1,bd=.03;m.forEach((q,i)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;best=i}});if(best>=0)drag=[m,best];return}cur.push(p);draw()});
cv.addEventListener('pointermove',e=>{if(drag){drag[0][drag[1]]=pos(e);draw()}});addEventListener('pointerup',()=>{if(drag){drag=null;saveM()}});
document.getElementById('close').onclick=()=>{if(cur.length>2){masks[regSel.value]=cur;cur=[];saveM();draw()}};
document.getElementById('undo').onclick=()=>{cur.pop();draw()};document.getElementById('clearR').onclick=()=>{delete masks[regSel.value];cur=[];saveM();draw()};
document.getElementById('edit').onclick=e=>{editMode=!editMode;e.target.classList.toggle('on',editMode);draw()};
regSel.onchange=()=>{cur=[];draw()};document.getElementById('ba').oninput=draw;
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;draw()};i.src=URL.createObjectURL(f)};
